name: Universe V6 checks
on:
  pull_request:
  push:
    branches: [codex/universe-v6, codex/universe-v6-system-theme, codex/universe-v6-startup]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-save playwright@1.58.2 @napi-rs/canvas@0.1.80
      - name: Install desktop and Safari engine browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Validate uploaded patch compatibility
        run: python3 universe-patch-test.py
      - name: Offline shell regression
        run: node universe-offline-test.cjs
      - name: Existing identity and NFC regression
        run: node flow-integrity-test.cjs
      - name: Existing image and print regression
        run: node recovery-smoke-test.cjs
      - name: Universe desktop and mobile journeys
        run: node universe-browser-test.cjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universe-ui-screenshots
          path: test-output/
          if-no-files-found: ignore
          retention-days: 7
